<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B6E79" />
    <link rel="icon" type="image/svg+xml" href="/brand/chartnav-favicon.svg" />
    <title>ChartNav MD — Ophthalmology Workflow + Provider-Reviewed Documentation</title>
    <meta
      name="description"
      content="ChartNav is the clinical workflow layer for ophthalmology practices. Role-based clinic dashboards, retina and glaucoma tracking, imaging metadata review, OD/OS retinal diagram, and provider-reviewed documentation — provider-controlled at every step. Not a certified EHR replacement. Not HIPAA-certified by default."
    />
    <meta
      property="og:title"
      content="ChartNav MD — Ophthalmology Workflow + Provider-Reviewed Documentation"
    />
    <meta
      property="og:description"
      content="Ophthalmology clinic workflow layer. Front desk to provider sign-off. Built for eye-care lanes. Provider-reviewed at every step."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="ChartNav MD — Ophthalmology Workflow + Provider-Reviewed Documentation"
    />
    <meta
      name="twitter:description"
      content="Ophthalmology clinic workflow layer. Provider-controlled. Not a certified EHR."
    />
    <!--
      Spanish localization (apps/web/src/i18n). The landing page's
      React component updates `<title>` and `<meta name="description">`
      at runtime when the active language is Spanish; these
      `hreflang` alternates declare the available language variants
      for SEO crawlers. Language is selected via `?lang=es` /
      `?lang=en` (or `/es/landing` if the deploy ever route-prefixes
      languages). Both URLs resolve to the same public landing page
      today; the React app reads the language client-side.
    -->
    <link
      rel="alternate"
      hreflang="en"
      href="https://www.chartnavmd.com/landing"
    />
    <link
      rel="alternate"
      hreflang="es"
      href="https://www.chartnavmd.com/landing?lang=es"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://www.chartnavmd.com/landing"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
