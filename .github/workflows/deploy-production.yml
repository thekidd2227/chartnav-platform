name: deploy-production

# Production deploy. Manual dispatch ONLY, gated by the protected `production`
# GitHub environment (required reviewers). Mirrors the staging steps: build +
# push image, build + upload frontend, one-off migration task, rolling ECS
# update, health verification. OIDC to AWS — no long-lived keys. There is NO
# automatic production deploy from a branch.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA / tag already built + verified in staging"
        required: true
      confirm:
        description: "Type 'deploy-production' to confirm"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          test "${{ inputs.confirm }}" = "deploy-production" \
            || { echo "confirmation phrase mismatch"; exit 1; }

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment: production   # protected: requires reviewer approval
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve + verify image exists (built in staging, immutable tag)
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/chartnav/api:${{ inputs.image_tag }}"
          aws ecr describe-images --repository-name chartnav/api \
            --image-ids imageTag=${{ inputs.image_tag }} >/dev/null
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build + upload frontend
        run: |
          cd apps/web
          npm ci
          VITE_API_URL="https://${{ vars.API_HOSTNAME }}" npm run build
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      - name: Register task definition revision
        id: taskdef
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' > taskdef.json
          python - <<'PY'
          import json
          td = json.load(open("taskdef.json"))
          for c in td["containerDefinitions"]:
              if c["name"] == "api":
                  c["image"] = "${{ steps.image.outputs.image }}"
          for k in ("taskDefinitionArn","revision","status","requiresAttributes",
                    "compatibilities","registeredAt","registeredBy"):
              td.pop(k, None)
          json.dump(td, open("taskdef.new.json","w"))
          PY
          ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: One-off migration task (verified on staging first)
        run: |
          TASK_ARN=$(aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ vars.API_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["./entrypoint.sh","migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          test "$CODE" = "0"

      - name: Roll service + wait stable
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" --task-definition "${{ steps.taskdef.outputs.arn }}"
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.API_HOSTNAME }}/readyz"; then exit 0; fi
            sleep 10
          done
          echo "rollback: re-run update-service with the previous task definition revision"
          exit 1
