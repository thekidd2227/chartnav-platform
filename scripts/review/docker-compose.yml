# ChartNav local REVIEW stack — for founder/hands-on testing only.
# NOT production. Dev header-auth identity selection, deterministic synthetic
# ophthalmology seed, persistent volumes. No real PHI, no live external calls.
#
# Driven by scripts/review/start_chartnav_review.sh (do not run by hand unless
# you know what you're doing). Migration + seed run as separate one-shot
# services so startup is deterministic and the API serves a ready database.

name: chartnav-review

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chartnav
      POSTGRES_PASSWORD: review-local-only-not-a-real-secret
      POSTGRES_DB: chartnav
    volumes:
      - chartnav_review_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartnav -d chartnav"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Not published to the host — internal only (avoids clashing with a local PG).

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: chartnav
      MINIO_ROOT_PASSWORD: review-local-only-not-a-real-secret
    volumes:
      - chartnav_review_minio:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 chartnav review-local-only-not-a-real-secret &&
      mc mb --ignore-existing local/chartnav-review-objects &&
      mc anonymous set none local/chartnav-review-objects &&
      echo 'bucket ready (private)';
      "
    restart: "no"

  migrate:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    image: chartnav-review-api:dev
    environment:
      CHARTNAV_ENV: dev
      DATABASE_URL: postgresql+psycopg://chartnav:review-local-only-not-a-real-secret@db:5432/chartnav
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: chartnav-review-api:dev
    environment:
      CHARTNAV_ENV: dev
      DATABASE_URL: postgresql+psycopg://chartnav:review-local-only-not-a-real-secret@db:5432/chartnav
    command: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: chartnav-review-api:dev
    environment:
      CHARTNAV_ENV: dev
      CHARTNAV_AUTH_MODE: header        # dev-only identity selection (X-User-Email)
      DATABASE_URL: postgresql+psycopg://chartnav:review-local-only-not-a-real-secret@db:5432/chartnav
      CHARTNAV_CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Object storage: the local filesystem adapter (the existing S3-compatible
      # dev adapter). MinIO is available above for when storage is wired to
      # features; see docs/review/KNOWN_LIMITATIONS.md.
      CHARTNAV_STORAGE_BACKEND: local
      CHARTNAV_STORAGE_LOCAL_ROOT: /app/object_store
      WEB_CONCURRENCY: "2"
    command: ["serve"]
    depends_on:
      seed:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile       # dev image: vite dev server on 5173
    image: chartnav-review-web:dev
    environment:
      VITE_API_URL: http://localhost:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  chartnav_review_pg:
  chartnav_review_minio:
